<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>죽BTI — 당신은 죽음 앞에서 어떤 사람인가요? | 죽음문해력커넥트</title>
<meta name="description" content="10문항으로 알아보는 나의 죽음문해력 유형 8가지. 웃으면서 가족과 죽음 이야기를 시작하는 가장 쉬운 방법.">
<meta property="og:title" content="죽BTI — 당신은 죽음 앞에서 어떤 사람인가요?">
<meta property="og:description" content="10문항으로 알아보는 나의 죽음문해력 유형 8가지.">
<meta property="og:image" content="https://death-literacy-connect.kr/deathbti/cards/cover.jpg">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/deathbti/deathbti.css">
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="/"><img src="/logo-kr.png" alt="죽음문해력커넥트"></a>
    <div class="tabs">
      <a href="/">홈</a>
      <a href="/deathtival">데스티벌</a>
      <a class="on" href="/deathbti">죽BTI</a>
      <a href="/en/deathbti" title="English">EN</a>
    </div>
    <a class="cta" href="/deathtival/apply">신청하기 →</a>
  </div>
</nav>

<main class="dbti">

  <!-- ① 인트로 -->
  <section class="step on intro" id="s-intro">
    <div class="wrap">
      <div class="eyebrow">죽음문해력커넥트</div>
      <h1>죽BTI</h1>
      <p class="lead">당신은 죽음 앞에서<br>어떤 사람인가요?</p>
      <div class="grid" id="introGrid"></div>
      <p class="meta">10문항 · 약 1분<span id="introStat"></span></p>
      <div class="safe">최근에 소중한 분을 보내셨다면, 오늘은 그냥 쉬어가셔도 좋아요.</div>
      <div class="go"><button class="btn dark" id="startBtn">시작하기 →</button></div>
    </div>
  </section>

  <!-- ② 문항 -->
  <section class="step" id="s-quiz">
    <div class="wrap">
      <div class="qbox">
        <div class="qhead">
          <span class="cnt" id="qcnt">1 / 10</span>
        </div>
        <div class="bar"><i id="qbar" style="width:10%"></i></div>
        <h2 id="qtext">…</h2>
        <div class="opts" id="qopts"></div>
        <div class="qfoot"><button class="back" id="backBtn">← 이전 질문</button></div>
      </div>
    </div>
  </section>

  <!-- ③ 결과 -->
  <section class="step res" id="s-result">
    <div class="wrap">
      <div class="card"><img id="rcard" alt="결과 카드"></div>
      <p class="rarity" id="rrarity"></p>
      <div class="desc" id="rdesc"></div>
      <p class="sub" id="rsub"></p>

      <div class="cta-family">
        <div class="h">내 주변 사람은<br>어떤 유형일까?</div>
        <div class="p">갑작스럽게 "죽음에 대해 얘기해요" 하지 말고,<br>죽BTI 같이 해봐요!</div>
        <div class="quote" id="rquote">"나 이거 나왔는데 너는 뭐 나왔어?"</div>
        <div class="btns">
          <button id="shareBtn">공유하기</button>
          <button class="ghost" id="copyBtn">링크 복사</button>
        </div>
        <div class="stat" id="rstat"></div>
      </div>

      <div class="opposite" id="ropp"></div>

      <div class="again">
        <button id="saveBtn">결과 카드 저장</button>
        <button id="retryBtn">다시 하기</button>
        <a href="/deathtival">데스티벌 보러 가기 →</a>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <div>© 2026 죽음문해력커넥트 · 데스<span>(Death)</span>롭지 않은 이야기</div>
    <div><a href="/privacy">개인정보 처리방침</a></div>
  </div>
</footer>

<div class="toast" id="toast"></div>
<script type="module" src="/deathbti/deathbti.js"></script>
</body>
</html>
